<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nunta Larisa și Cătălin</title>
<meta name="description" content="Încarcă pozele și clipurile tale de la nunta Larisei și a lui Cătălin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #0f6e57;
    --verde-inchis: #0a4a3b;
    --verde-pal: #d5e6df;
    --crem: #faf8f3;
    --auriu: #c9b287;
    --text: #333b37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background: var(--crem);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ornament {
    color: var(--auriu);
    letter-spacing: .5em;
    font-size: .9rem;
    margin: 26px 0 4px;
  }
  .photo-frame {
    /* se micșorează și după înălțimea ecranului, ca butonul să rămână vizibil */
    width: min(72vw, 320px, 34vh);
    aspect-ratio: 4 / 5;
    border-radius: 50% 50% 46% 46% / 40% 40% 56% 56%;
    overflow: hidden;
    border: 6px solid #fff;
    box-shadow: 0 12px 40px rgba(10, 74, 59, .28);
    background: var(--verde-pal);
    margin: 18px 0 8px;
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .photo-frame img.loaded { opacity: 1; }
  .photo-frame.loading {
    background: linear-gradient(110deg, var(--verde-pal) 40%, #e8f2ed 50%, var(--verde-pal) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: -200% 0; }
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2rem, 8vw, 3.2rem);
    color: var(--verde-inchis);
    text-align: center;
    line-height: 1.15;
    margin-top: 18px;
    padding: 0 16px;
  }
  h1 .amp {
    font-style: italic;
    color: var(--verde);
  }
  .subtitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--verde);
    margin-top: 8px;
    text-align: center;
    padding: 0 24px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--auriu);
  }
  .divider::before, .divider::after {
    content: '';
    width: 60px;
    height: 1px;
    background: var(--auriu);
  }
  .upload-btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: .04em;
    color: #fff;
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-inchis) 100%);
    border: none;
    border-radius: 999px;
    padding: 18px 42px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(10, 74, 59, .38);
    transition: transform .15s, box-shadow .15s;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: 92vw;
  }
  .btn-line1 {
    font-size: .78rem;
    font-weight: 400;
    letter-spacing: .02em;
    opacity: .95;
  }
  .btn-line2 {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .upload-btn:active { transform: scale(.97); }
  .upload-btn svg { flex: none; }
  .upload-btn:disabled {
    opacity: .85;
    cursor: wait;
    transform: none;
  }
  .spinner {
    width: 20px;
    height: 20px;
    flex: none;
    border: 3px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  input[type="file"] { display: none; }
  .hint {
    font-size: .8rem;
    color: #8a8f85;
    margin-top: 14px;
    text-align: center;
    padding: 0 24px;
  }
  .progress-list {
    width: min(92vw, 480px);
    margin: 26px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-item {
    background: #fff;
    border: 1px solid var(--verde-pal);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: .8rem;
  }
  .progress-item .name {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .progress-item .name .status { flex: none; color: var(--verde-inchis); }
  .progress-item .track {
    height: 6px;
    background: var(--verde-pal);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-item .fill {
    height: 100%;
    width: 0;
    background: var(--verde);
    border-radius: 3px;
    transition: width .2s;
  }
  .progress-item.error .status { color: #b05050; }
  .progress-item.done .fill { background: var(--verde-inchis); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--verde-inchis);
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: .9rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  /* ---- Cadoul de satin smarald care se deschide la intrare ---- */
  #gift {
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow: hidden;
    perspective: 1300px;
  }
  /* după deschidere, pagina de dedesubt devine imediat utilizabilă */
  #gift.open { pointer-events: none; }
  /* o scânteiere caldă de lumină când se desfac panourile, apoi dispare */
  #gift::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 45% 60% at 50% 50%, rgba(255, 248, 225, .7), rgba(255, 248, 225, .2) 45%, transparent 70%);
    opacity: 0;
    pointer-events: none;
  }
  #gift.open::before { animation: bloomFlash 1.5s ease .6s forwards; }
  @keyframes bloomFlash {
    0% { opacity: 0; }
    35% { opacity: 1; }
    100% { opacity: 0; }
  }
  #gift .panel {
    position: absolute;
    top: -2vh;
    bottom: -2vh;
    width: 51%;
    background-color: #0d6350;
    background-image:
      /* țesătura fină a satinului */
      repeating-linear-gradient(115deg, rgba(255,255,255,.045) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(25deg, rgba(0,0,0,.05) 0 1px, transparent 1px 7px),
      /* falduri de material */
      linear-gradient(112deg,
        transparent 0%, rgba(255,255,255,.13) 9%, transparent 17%,
        rgba(0,0,0,.22) 27%, transparent 36%,
        rgba(255,255,255,.18) 46%, rgba(255,255,255,.05) 52%, transparent 58%,
        rgba(0,0,0,.28) 70%, transparent 80%,
        rgba(255,255,255,.10) 89%, transparent 100%),
      /* sclipirea mare de satin */
      radial-gradient(ellipse 60% 42% at 30% 22%, rgba(255,255,255,.30), transparent 60%),
      radial-gradient(ellipse 45% 35% at 74% 68%, rgba(255,255,255,.14), transparent 55%),
      radial-gradient(ellipse 55% 45% at 62% 8%, rgba(2, 36, 28, .55), transparent 60%),
      radial-gradient(ellipse 50% 45% at 25% 88%, rgba(2, 36, 28, .6), transparent 60%),
      linear-gradient(128deg, #12775d 0%, #0b5a46 28%, #128063 50%, #06443a 74%, #0d6350 100%);
    transition: transform 1.5s cubic-bezier(.62, 0, .23, 1) .6s, filter 1.5s ease .6s;
    will-change: transform;
  }
  #gift .panel.left {
    left: 0;
    transform-origin: left center;
    box-shadow: inset -24px 0 45px -14px rgba(0,0,0,.55);
  }
  #gift .panel.right {
    right: 0;
    transform-origin: right center;
    box-shadow: inset 24px 0 45px -14px rgba(0,0,0,.55);
  }
  /* panourile se deschid ca niște uși grele de material, spre privitor */
  #gift.open .panel.left { transform: rotateY(94deg) translateZ(2vw); filter: brightness(.45); }
  #gift.open .panel.right { transform: rotateY(-94deg) translateZ(2vw); filter: brightness(.45); }
  #gift .ribbon-v, #gift .ribbon-h {
    position: absolute;
    background:
      repeating-linear-gradient(90deg, rgba(120, 95, 50, .25) 0 1px, transparent 1px 4px),
      linear-gradient(90deg, #97804f 0%, #e9d7a7 26%, #cbb282 48%, #f4e5ba 70%, #97804f 100%);
    box-shadow: 0 0 22px rgba(0,0,0,.45), inset 0 0 8px rgba(255,255,255,.25);
    transition: transform .8s cubic-bezier(.45, 0, .85, .4) .05s, opacity .7s .15s;
    will-change: transform;
  }
  #gift .ribbon-v { top: 0; bottom: 0; left: 50%; width: 58px; margin-left: -29px; }
  #gift .ribbon-h {
    left: 0; right: 0; top: 50%; height: 58px; margin-top: -29px;
    background:
      repeating-linear-gradient(0deg, rgba(120, 95, 50, .25) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #97804f 0%, #e9d7a7 26%, #cbb282 48%, #f4e5ba 70%, #97804f 100%);
  }
  /* panglicile cad cu greutate, ușor rotite */
  #gift.open .ribbon-v { transform: translateY(112vh) rotate(7deg); opacity: 0; }
  #gift.open .ribbon-h { transform: translateX(60vw) translateY(112vh) rotate(-10deg); opacity: 0; }
  #gift .bow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.5));
    will-change: transform;
  }
  #gift.open .bow {
    animation: bowFly 1.15s cubic-bezier(.55, -.15, .75, .4) forwards;
  }
  @keyframes bowFly {
    0%   { transform: translate(-50%, -50%); opacity: 1; }
    22%  { transform: translate(-50%, -50%) translateY(3.5vh) rotate(-5deg) scale(1.06); opacity: 1; }
    100% { transform: translate(-50%, -50%) translateY(-135vh) translateX(10vw) rotate(28deg) scale(1.1); opacity: 0; }
  }
  #gift .tap-hint {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    color: #f3ead3;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.3rem;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
    animation: pulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes pulse {
    0%, 100% { opacity: .75; }
    50% { opacity: 1; }
  }
  #gift.open .tap-hint { opacity: 0; transition: opacity .3s; animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #gift { display: none; }
  }
  /* ecrane mai scunde: strângem spațiile ca poza + butonul să încapă împreună */
  @media (max-height: 740px) {
    .ornament { margin: 12px 0 2px; }
    .photo-frame { margin: 12px 0 4px; }
    h1 { font-size: clamp(1.7rem, 6.5vw, 2.5rem); margin-top: 10px; }
    .subtitle { font-size: 1rem; margin-top: 5px; }
    .divider { margin: 14px 0; }
    .upload-btn { padding: 14px 34px; }
    .hint { margin-top: 10px; }
  }
  footer {
    margin-top: auto;
    padding: 18px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    color: var(--verde);
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div id="gift" role="button" aria-label="Deschide">
    <div class="panel left"></div>
    <div class="panel right"></div>
    <div class="ribbon-h"></div>
    <div class="ribbon-v"></div>
    <svg class="bow" width="210" height="172" viewBox="0 0 210 172">
      <defs>
        <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f4e6bc"/>
          <stop offset="40%" stop-color="#d4bc8c"/>
          <stop offset="100%" stop-color="#977f50"/>
        </linearGradient>
        <linearGradient id="goldB" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4e6bc"/>
          <stop offset="40%" stop-color="#d4bc8c"/>
          <stop offset="100%" stop-color="#977f50"/>
        </linearGradient>
        <radialGradient id="knotG" cx="35%" cy="30%" r="90%">
          <stop offset="0%" stop-color="#f8ecc7"/>
          <stop offset="55%" stop-color="#cbb282"/>
          <stop offset="100%" stop-color="#83704a"/>
        </radialGradient>
      </defs>
      <!-- cozile panglicii, cu capete crestate -->
      <path d="M105 86 C82 106 60 132 70 150 L87 142 L83 160 C100 154 107 122 105 86 Z" fill="url(#goldB)" stroke="#83704a" stroke-width="1.5"/>
      <path d="M105 86 C128 106 150 132 140 150 L123 142 L127 160 C110 154 103 122 105 86 Z" fill="url(#goldA)" stroke="#83704a" stroke-width="1.5"/>
      <path d="M103 92 C88 110 76 130 79 144" stroke="rgba(90,70,35,.45)" stroke-width="1.5" fill="none"/>
      <path d="M107 92 C122 110 134 130 131 144" stroke="rgba(90,70,35,.45)" stroke-width="1.5" fill="none"/>
      <!-- buclele fundei -->
      <path d="M105 80 C60 30 16 36 13 64 C10 92 56 102 105 80 Z" fill="url(#goldA)" stroke="#83704a" stroke-width="2"/>
      <path d="M105 80 C150 30 194 36 197 64 C200 92 154 102 105 80 Z" fill="url(#goldB)" stroke="#83704a" stroke-width="2"/>
      <!-- umbre în interiorul buclelor -->
      <path d="M105 80 C68 50 34 52 26 68 C36 86 72 90 105 80 Z" fill="rgba(55,42,15,.20)"/>
      <path d="M105 80 C142 50 176 52 184 68 C174 86 138 90 105 80 Z" fill="rgba(55,42,15,.20)"/>
      <!-- reflexe de lumină pe bucle -->
      <path d="M96 72 C68 44 38 44 25 58" stroke="rgba(255,250,230,.6)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M114 72 C142 44 172 44 185 58" stroke="rgba(255,250,230,.6)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- nodul -->
      <circle cx="105" cy="79" r="17" fill="url(#knotG)" stroke="#83704a" stroke-width="2"/>
      <path d="M93 71 C99 78 99 82 94 88" stroke="rgba(90,70,35,.5)" stroke-width="1.5" fill="none"/>
      <path d="M117 71 C111 78 111 82 116 88" stroke="rgba(90,70,35,.5)" stroke-width="1.5" fill="none"/>
      <ellipse cx="99" cy="72" rx="5" ry="3" fill="rgba(255,250,230,.55)" transform="rotate(-25 99 72)"/>
    </svg>
    <div class="tap-hint">Un cadou pentru amintirile noastre…</div>
  </div>

  <div class="ornament">✦ ✦ ✦</div>

  <div class="photo-frame loading" id="photoFrame">
    <img id="couplePhoto" src="couple.jpg" onerror="this.onerror=null;this.src='couple-placeholder.svg'" alt="Larisa și Cătălin">
  </div>

  <h1>Larisa <span class="amp">&amp;</span> Cătălin</h1>
  <p class="subtitle">Ajută-ne să păstrăm fiecare clipă a acestei zile</p>

  <div class="divider">❦</div>

  <button class="upload-btn" id="uploadBtn">
    <span class="btn-line1">📸 Poți selecta mai multe poze și clipuri deodată!</span>
    <span class="btn-line2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Încarcă aici
    </span>
  </button>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple>

  <p class="hint">Ține apăsat pe o poză în galerie ca să selectezi mai multe.<br>Maxim 100 MB per fișier.</p>

  <div class="progress-list" id="progressList"></div>

  <div class="toast" id="toast"></div>

  <footer>Cu drag, Larisa &amp; Cătălin ✦</footer>

<script>
// Cadoul de satin se desface singur la scurt timp după încărcare
// (sau la o atingere, dacă invitatul e nerăbdător)
const gift = document.getElementById('gift');
let giftOpened = false;
function openGift() {
  if (giftOpened) return;
  giftOpened = true;
  gift.classList.add('open');
  setTimeout(() => gift.remove(), 2600);
}
gift.addEventListener('click', openGift);
setTimeout(openGift, 1400);

const fileInput = document.getElementById('fileInput');
const progressList = document.getElementById('progressList');
const toast = document.getElementById('toast');
const uploadBtn = document.getElementById('uploadBtn');
const uploadBtnHtml = uploadBtn.innerHTML;
const MAX_FILE = 100 * 1024 * 1024;

// Shimmer pe rama pozei până se încarcă imaginea mirilor
const couplePhoto = document.getElementById('couplePhoto');
const photoFrame = document.getElementById('photoFrame');
function photoReady() {
  couplePhoto.classList.add('loaded');
  photoFrame.classList.remove('loading');
}
if (couplePhoto.complete && couplePhoto.naturalWidth > 0) photoReady();
else couplePhoto.addEventListener('load', photoReady);

// Poza mirilor din admin (dacă a fost setată) înlocuiește imaginea implicită
fetch('/api/couple', { method: 'GET' }).then(res => {
  if (res.ok) couplePhoto.src = '/api/couple?v=' + Date.now();
}).catch(() => {});

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const files = Array.from(fileInput.files);
  fileInput.value = '';
  if (files.length) uploadAll(files);
});

function setUploadingState(current, total) {
  uploadBtn.disabled = true;
  uploadBtn.innerHTML = '<span class="btn-line2"><span class="spinner"></span> Se încarcă ' + current + ' din ' + total + '…</span>';
}

function resetUploadBtn() {
  uploadBtn.disabled = false;
  uploadBtn.innerHTML = uploadBtnHtml;
}

// Unele telefoane trimit videoclipuri cu nume/tip de poză (.jpeg) —
// citim primii octeți ca să aflăm ce este cu adevărat fișierul.
async function sniffType(file) {
  const buf = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const ascii = String.fromCharCode.apply(null, buf);
  if (ascii.slice(4, 8) === 'ftyp') {
    const brand = ascii.slice(8, 12).trim();
    if (brand.slice(0, 2) === 'qt') return { type: 'video/quicktime', ext: 'mov', video: true };
    if (['heic', 'heix', 'hevc', 'heif', 'mif1', 'msf1', 'heis'].indexOf(brand) !== -1)
      return { type: 'image/heic', ext: 'heic', video: false };
    if (brand === 'avif' || brand === 'avis') return { type: 'image/avif', ext: 'avif', video: false };
    if (brand.slice(0, 3) === '3gp') return { type: 'video/3gpp', ext: '3gp', video: true };
    return { type: 'video/mp4', ext: 'mp4', video: true };
  }
  if (buf[0] === 0xFF && buf[1] === 0xD8) return { type: 'image/jpeg', ext: 'jpg', video: false };
  if (buf[0] === 0x89 && ascii.slice(1, 4) === 'PNG') return { type: 'image/png', ext: 'png', video: false };
  if (ascii.slice(0, 3) === 'GIF') return { type: 'image/gif', ext: 'gif', video: false };
  if (buf[0] === 0x42 && buf[1] === 0x4D) return { type: 'image/bmp', ext: 'bmp', video: false };
  if ((buf[0] === 0x49 && buf[1] === 0x49 && buf[2] === 0x2A && buf[3] === 0) ||
      (buf[0] === 0x4D && buf[1] === 0x4D && buf[2] === 0 && buf[3] === 0x2A)) return { type: 'image/tiff', ext: 'tif', video: false };
  if (ascii.slice(0, 4) === 'RIFF' && ascii.slice(8, 12) === 'WEBP') return { type: 'image/webp', ext: 'webp', video: false };
  if (buf[0] === 0x1A && buf[1] === 0x45 && buf[2] === 0xDF && buf[3] === 0xA3) return { type: 'video/webm', ext: 'webm', video: true };
  return null;
}

const VIDEO_EXTS = ['mp4', 'm4v', 'mov', 'webm', 'mkv', 'avi', '3gp', 'ts', 'mts', 'm2ts', 'mpg', 'mpeg', 'wmv'];

async function fixNameAndType(file) {
  let name = file.name || 'amintire';
  let type = file.type || '';
  try {
    const s = await sniffType(file);
    if (s) {
      const m = name.match(/\.([A-Za-z0-9]+)$/);
      const ext = m ? m[1].toLowerCase() : '';
      const extIsVideo = VIDEO_EXTS.indexOf(ext) !== -1;
      // redenumim doar dacă extensia minte (ex. video cu nume .jpeg) sau lipsește
      if (!ext || extIsVideo !== s.video) {
        name = (m ? name.slice(0, -m[0].length) : name) + '.' + s.ext;
        type = s.type;
      } else if (!type) {
        type = s.type;
      }
    }
  } catch (e) {}
  return { name, type: type || 'application/octet-stream' };
}

async function uploadAll(files) {
  let uploaded = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    setUploadingState(i + 1, files.length);
    const fixed = await fixNameAndType(file);
    const item = createProgressItem(fixed.name);
    if (file.size > MAX_FILE) {
      markError(item, 'Peste 100 MB');
      continue;
    }
    try {
      await uploadFile(file, item, fixed);
      uploaded++;
    } catch (err) {
      markError(item, err.message || 'Eroare');
    }
  }
  resetUploadBtn();
  if (uploaded > 0) {
    showToast(uploaded === 1
      ? 'Mulțumim! Amintirea ta a fost încărcată ♥'
      : 'Mulțumim! ' + uploaded + ' amintiri au fost încărcate ♥');
  }
}

function uploadFile(file, item, fixed) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?name=' + encodeURIComponent(fixed.name));
    xhr.setRequestHeader('content-type', fixed.type);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        item.querySelector('.fill').style.width = (e.loaded / e.total * 100) + '%';
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        item.classList.add('done');
        item.querySelector('.status').textContent = '✓ Încărcat';
        item.querySelector('.fill').style.width = '100%';
        resolve();
      } else {
        let msg = 'Eroare la încărcare';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error('Conexiune întreruptă — încearcă din nou'));
    xhr.send(file);
  });
}

function createProgressItem(name) {
  const div = document.createElement('div');
  div.className = 'progress-item';
  div.innerHTML =
    '<div class="name"><span>' + escapeHtml(name) + '</span><span class="status">Se încarcă…</span></div>' +
    '<div class="track"><div class="fill"></div></div>';
  progressList.prepend(div);
  return div;
}

function markError(item, msg) {
  item.classList.add('error');
  item.querySelector('.status').textContent = '✗ ' + msg;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
}
</script>
</body>
