<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nunta Larisa și Cătălin</title>
<meta name="description" content="Încarcă pozele și clipurile tale de la nunta Larisei și a lui Cătălin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #0f6e57;
    --verde-inchis: #0a4a3b;
    --verde-pal: #d5e6df;
    --crem: #faf8f3;
    --auriu: #c9b287;
    --text: #333b37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background: var(--crem);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ornament {
    color: var(--auriu);
    letter-spacing: .5em;
    font-size: .9rem;
    margin: 26px 0 4px;
  }
  .photo-frame {
    width: min(78vw, 340px);
    aspect-ratio: 4 / 5;
    border-radius: 50% 50% 46% 46% / 40% 40% 56% 56%;
    overflow: hidden;
    border: 6px solid #fff;
    box-shadow: 0 12px 40px rgba(10, 74, 59, .28);
    background: var(--verde-pal);
    margin: 18px 0 8px;
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2rem, 8vw, 3.2rem);
    color: var(--verde-inchis);
    text-align: center;
    line-height: 1.15;
    margin-top: 18px;
    padding: 0 16px;
  }
  h1 .amp {
    font-style: italic;
    color: var(--verde);
  }
  .subtitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--verde);
    margin-top: 8px;
    text-align: center;
    padding: 0 24px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--auriu);
  }
  .divider::before, .divider::after {
    content: '';
    width: 60px;
    height: 1px;
    background: var(--auriu);
  }
  .upload-btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: .04em;
    color: #fff;
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-inchis) 100%);
    border: none;
    border-radius: 999px;
    padding: 18px 42px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(10, 74, 59, .38);
    transition: transform .15s, box-shadow .15s;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .upload-btn:active { transform: scale(.97); }
  .upload-btn svg { flex: none; }
  input[type="file"] { display: none; }
  .hint {
    font-size: .8rem;
    color: #8a8f85;
    margin-top: 14px;
    text-align: center;
    padding: 0 24px;
  }
  .progress-list {
    width: min(92vw, 480px);
    margin: 26px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-item {
    background: #fff;
    border: 1px solid var(--verde-pal);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: .8rem;
  }
  .progress-item .name {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .progress-item .name .status { flex: none; color: var(--verde-inchis); }
  .progress-item .track {
    height: 6px;
    background: var(--verde-pal);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-item .fill {
    height: 100%;
    width: 0;
    background: var(--verde);
    border-radius: 3px;
    transition: width .2s;
  }
  .progress-item.error .status { color: #b05050; }
  .progress-item.done .fill { background: var(--verde-inchis); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--verde-inchis);
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: .9rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  /* ---- Cadoul de satin smarald care se deschide la intrare ---- */
  #gift {
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow: hidden;
  }
  #gift .panel {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 51%;
    background-color: #0d6350;
    background-image:
      radial-gradient(ellipse 55% 38% at 22% 18%, rgba(255,255,255,.28), transparent 60%),
      radial-gradient(ellipse 45% 32% at 72% 62%, rgba(255,255,255,.16), transparent 55%),
      radial-gradient(ellipse 60% 45% at 60% 12%, rgba(3, 42, 33, .5), transparent 60%),
      radial-gradient(ellipse 50% 42% at 28% 82%, rgba(3, 42, 33, .55), transparent 60%),
      radial-gradient(ellipse 35% 25% at 48% 45%, rgba(255,255,255,.14), transparent 55%),
      linear-gradient(128deg, #117a5f 0%, #0b5a46 28%, #12735a 50%, #07443a 74%, #0d6350 100%);
    transition: transform 1.1s cubic-bezier(.7, 0, .3, 1) .55s;
  }
  #gift .panel.left { left: 0; box-shadow: inset -18px 0 30px -12px rgba(0,0,0,.45); }
  #gift .panel.right { right: 0; box-shadow: inset 18px 0 30px -12px rgba(0,0,0,.45); }
  #gift.open .panel.left { transform: translateX(-103%); }
  #gift.open .panel.right { transform: translateX(103%); }
  #gift .ribbon-v, #gift .ribbon-h {
    position: absolute;
    background: linear-gradient(90deg, #a8905f 0%, #e3cf9e 30%, #cbb282 50%, #eeddb2 72%, #a8905f 100%);
    box-shadow: 0 0 18px rgba(0,0,0,.35);
    transition: transform .55s cubic-bezier(.6, 0, .8, .5) .1s, opacity .5s .1s;
  }
  #gift .ribbon-v { top: 0; bottom: 0; left: 50%; width: 56px; margin-left: -28px; }
  #gift .ribbon-h {
    left: 0; right: 0; top: 50%; height: 56px; margin-top: -28px;
    background: linear-gradient(180deg, #a8905f 0%, #e3cf9e 30%, #cbb282 50%, #eeddb2 72%, #a8905f 100%);
  }
  #gift.open .ribbon-v { transform: translateY(105vh); opacity: 0; }
  #gift.open .ribbon-h { transform: translateX(105vw); opacity: 0; }
  #gift .bow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.4));
    transition: transform .8s cubic-bezier(.5, -0.3, .7, .2), opacity .7s;
  }
  #gift.open .bow {
    transform: translate(-50%, -50%) translateY(-120vh) rotate(24deg) scale(1.15);
    opacity: 0;
  }
  #gift .tap-hint {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    color: #f3ead3;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.3rem;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
    animation: pulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes pulse {
    0%, 100% { opacity: .75; }
    50% { opacity: 1; }
  }
  #gift.open .tap-hint { opacity: 0; transition: opacity .3s; animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #gift { display: none; }
  }
  footer {
    margin-top: auto;
    padding: 18px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    color: var(--verde);
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div id="gift" role="button" aria-label="Deschide">
    <div class="panel left"></div>
    <div class="panel right"></div>
    <div class="ribbon-h"></div>
    <div class="ribbon-v"></div>
    <svg class="bow" width="190" height="150" viewBox="0 0 190 150">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e9d7a7"/>
          <stop offset="45%" stop-color="#c9b287"/>
          <stop offset="100%" stop-color="#a8905f"/>
        </linearGradient>
      </defs>
      <path d="M95 75 C55 30 15 35 12 60 C9 85 50 95 95 75 Z" fill="url(#gold)" stroke="#8f7a4e" stroke-width="2"/>
      <path d="M95 75 C135 30 175 35 178 60 C181 85 140 95 95 75 Z" fill="url(#gold)" stroke="#8f7a4e" stroke-width="2"/>
      <path d="M95 78 C70 100 58 125 72 138 C82 147 95 130 95 78 Z" fill="url(#gold)" stroke="#8f7a4e" stroke-width="2"/>
      <path d="M95 78 C120 100 132 125 118 138 C108 147 95 130 95 78 Z" fill="url(#gold)" stroke="#8f7a4e" stroke-width="2"/>
      <circle cx="95" cy="75" r="16" fill="url(#gold)" stroke="#8f7a4e" stroke-width="2"/>
    </svg>
    <div class="tap-hint">Un cadou pentru amintirile noastre…</div>
  </div>

  <div class="ornament">✦ ✦ ✦</div>

  <div class="photo-frame">
    <img id="couplePhoto" src="couple.jpg" onerror="this.onerror=null;this.src='couple-placeholder.svg'" alt="Larisa și Cătălin">
  </div>

  <h1>Larisa <span class="amp">&amp;</span> Cătălin</h1>
  <p class="subtitle">Ajută-ne să păstrăm fiecare clipă a acestei zile</p>

  <div class="divider">❦</div>

  <button class="upload-btn" id="uploadBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    Încarcă amintirile tale
  </button>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple>

  <p class="hint">Poți alege mai multe poze și videoclipuri din galeria telefonului.<br>Maxim 100 MB per fișier.</p>

  <div class="progress-list" id="progressList"></div>

  <div class="toast" id="toast"></div>

  <footer>Cu drag, Larisa &amp; Cătălin ✦</footer>

<script>
// Cadoul de satin se desface singur la scurt timp după încărcare
// (sau la o atingere, dacă invitatul e nerăbdător)
const gift = document.getElementById('gift');
let giftOpened = false;
function openGift() {
  if (giftOpened) return;
  giftOpened = true;
  gift.classList.add('open');
  setTimeout(() => gift.remove(), 1900);
}
gift.addEventListener('click', openGift);
setTimeout(openGift, 1400);

const fileInput = document.getElementById('fileInput');
const progressList = document.getElementById('progressList');
const toast = document.getElementById('toast');
const MAX_FILE = 100 * 1024 * 1024;

// Poza mirilor din admin (dacă a fost setată) înlocuiește placeholder-ul
fetch('/api/couple', { method: 'GET' }).then(res => {
  if (res.ok) document.getElementById('couplePhoto').src = '/api/couple?v=' + Date.now();
}).catch(() => {});

document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const files = Array.from(fileInput.files);
  fileInput.value = '';
  if (files.length) uploadAll(files);
});

async function uploadAll(files) {
  let uploaded = 0;
  for (const file of files) {
    const item = createProgressItem(file.name);
    if (file.size > MAX_FILE) {
      markError(item, 'Peste 100 MB');
      continue;
    }
    try {
      await uploadFile(file, item);
      uploaded++;
    } catch (err) {
      markError(item, err.message || 'Eroare');
    }
  }
  if (uploaded > 0) {
    showToast(uploaded === 1
      ? 'Mulțumim! Amintirea ta a fost încărcată ♥'
      : 'Mulțumim! ' + uploaded + ' amintiri au fost încărcate ♥');
  }
}

function uploadFile(file, item) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
    xhr.setRequestHeader('content-type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        item.querySelector('.fill').style.width = (e.loaded / e.total * 100) + '%';
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        item.classList.add('done');
        item.querySelector('.status').textContent = '✓ Încărcat';
        item.querySelector('.fill').style.width = '100%';
        resolve();
      } else {
        let msg = 'Eroare la încărcare';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error('Conexiune întreruptă — încearcă din nou'));
    xhr.send(file);
  });
}

function createProgressItem(name) {
  const div = document.createElement('div');
  div.className = 'progress-item';
  div.innerHTML =
    '<div class="name"><span>' + escapeHtml(name) + '</span><span class="status">Se încarcă…</span></div>' +
    '<div class="track"><div class="fill"></div></div>';
  progressList.prepend(div);
  return div;
}

function markError(item, msg) {
  item.classList.add('error');
  item.querySelector('.status').textContent = '✗ ' + msg;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
}
</script>
</body>
</html>
